[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-code"
version = "0.1.0"
description = "Open-source modular multi-agent AI coding harness (Linux for AI Coding)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "KAIROS Code Contributors" }
]
keywords = ["ai", "coding", "agents", "llm", "harness", "local-first", "modular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "gitpython>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
openai = ["openai>=1.30,<2.0"]
anthropic = ["anthropic>=0.30,<1.0"]
google = ["google-generativeai>=0.7,<1.0"]
ollama = ["ollama>=0.2.0"]
all = ["kairos-code[openai,anthropic,google,ollama]"]

[project.scripts]
kairos = "kairos_code.cli.main:app"
harness = "kairos_code.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos_code"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
