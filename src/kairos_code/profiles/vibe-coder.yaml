# Profile: vibe-coder
# Simple mode: fast, plain-language explanations, automatic tests, visual diffs, safe undo
profile: vibe-coder
runtime:
  mode: vibe
  max_iterations: 4
  timeout: 300
  auto_git_checkpoints: true

llm:
  default_provider: openai
  default_model: gpt-4o-mini

workflow:
  default: feature_development
  require_approval: []
  auto_test: true
  auto_review: true

agents:
  architect:
    enabled: true
  implementer:
    enabled: true
  reviewer:
    enabled: true
  tester:
    enabled: true
  debugger:
    enabled: false
  refactorer:
    enabled: false
  explainer:
    enabled: true
